# XcodeGen spec: run `xcodegen generate` to create EzBookkeeping.xcodeproj (which is not committed).
name: EzBookkeeping

options:
  bundleIdPrefix: com.ssiuuk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # simulator builds are signed "to run locally"; see the README for device signing
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EzBookkeeping:
    type: application
    platform: iOS
    sources:
      - path: EzBookkeeping
    info:
      path: EzBookkeeping/Info.plist
      properties:
        CFBundleDisplayName: ezBookkeeping
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # self-hosted servers are often plain http on a home network
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ezBookkeeping connects to the bookkeeping server you add, which may be on your home network.
        # sends transactions saved on the phone while the server was out of reach
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.ssiuuk.ezbookkeeping.sync
        NSCameraUsageDescription: ezBookkeeping uses the camera when you take a photo of a receipt for a transaction.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping
        PRODUCT_NAME: EzBookkeeping
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  EzBookkeepingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EzBookkeepingTests
    dependencies:
      - target: EzBookkeeping
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EzBookkeeping.app/EzBookkeeping
        BUNDLE_LOADER: $(TEST_HOST)

  EzBookkeepingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EzBookkeepingUITests
    dependencies:
      - target: EzBookkeeping
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping.uitests
        TEST_TARGET_NAME: EzBookkeeping

schemes:
  EzBookkeeping:
    build:
      targets:
        EzBookkeeping: all
        EzBookkeepingTests: [test]
        EzBookkeepingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: EzBookkeepingTests
        - name: EzBookkeepingUITests
    archive:
      config: Release
