# XcodeGen spec: run `xcodegen generate` to create EzBookkeeping.xcodeproj (which is not committed).
name: EzBookkeeping

options:
  bundleIdPrefix: com.ssiuuk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # simulator builds are signed "to run locally"; see the README for device signing
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # lists the strings the app shows for scripts/check-strings.py
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  EzBookkeeping:
    type: application
    platform: iOS
    sources:
      - path: EzBookkeeping
    dependencies:
      - target: EzBookkeepingWidget
    entitlements:
      path: EzBookkeeping/EzBookkeeping.entitlements
      properties:
        # shared with the widget: the server it shows, the purchases to review and the copy kept offline
        com.apple.security.application-groups:
          - group.com.ssiuuk.ezbookkeeping
    info:
      path: EzBookkeeping/Info.plist
      properties:
        CFBundleDisplayName: ezBookkeeping
        # the server's languages (Localizable.xcstrings); iOS offers them under the app in the Settings app
        CFBundleLocalizations:
          - en
          - de
          - el
          - es
          - fr
          - it
          - ja
          - kn
          - ko
          - nl
          - pl
          - pt
          - ro
          - ru
          - sl
          - ta
          - th
          - tr
          - uk
          - vi
          - zh-Hans
          - zh-Hant
        # the widget's buttons open ezbookkeeping://add and ezbookkeeping://review
        CFBundleURLTypes:
          - CFBundleURLName: com.ssiuuk.ezbookkeeping
            CFBundleURLSchemes:
              - ezbookkeeping
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # self-hosted servers are often plain http on a home network
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ezBookkeeping connects to the bookkeeping server you add, which may be on your home network.
        # sends transactions saved on the phone while the server was out of reach
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.ssiuuk.ezbookkeeping.sync
        NSCameraUsageDescription: ezBookkeeping uses the camera when you take a photo of a receipt for a transaction.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping
        PRODUCT_NAME: EzBookkeeping
        # set by the TestFlight workflow; empty for simulator builds
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_SPECIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  EzBookkeepingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EzBookkeepingWidget
      - path: EzBookkeeping/Resources
      # the app's API, models and formatting, which the widget uses to load its figures by itself
      - path: EzBookkeeping/API
      - path: EzBookkeeping/Models
      - path: EzBookkeeping/Support/Formats.swift
      - path: EzBookkeeping/Support/Summary.swift
      - path: EzBookkeeping/Support/TransactionText.swift
      - path: EzBookkeeping/Support/Colors.swift
      - path: EzBookkeeping/Support/LocalStore.swift
      - path: EzBookkeeping/Support/PendingPurchases.swift
      - path: EzBookkeeping/Support/WidgetShare.swift
    entitlements:
      path: EzBookkeepingWidget/EzBookkeepingWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ssiuuk.ezbookkeeping
    info:
      path: EzBookkeepingWidget/Info.plist
      properties:
        CFBundleDisplayName: ezBookkeeping
        CFBundleLocalizations:
          - en
          - de
          - el
          - es
          - fr
          - it
          - ja
          - kn
          - ko
          - nl
          - pl
          - pt
          - ro
          - ru
          - sl
          - ta
          - th
          - tr
          - uk
          - vi
          - zh-Hans
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping.widget
        PRODUCT_NAME: EzBookkeepingWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE_SPECIFIER)

  EzBookkeepingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EzBookkeepingTests
    dependencies:
      - target: EzBookkeeping
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EzBookkeeping.app/EzBookkeeping
        BUNDLE_LOADER: $(TEST_HOST)

  EzBookkeepingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EzBookkeepingUITests
    dependencies:
      - target: EzBookkeeping
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ssiuuk.ezbookkeeping.uitests
        TEST_TARGET_NAME: EzBookkeeping

schemes:
  EzBookkeeping:
    build:
      targets:
        EzBookkeeping: all
        EzBookkeepingTests: [test]
        EzBookkeepingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: EzBookkeepingTests
        - name: EzBookkeepingUITests
    archive:
      config: Release
