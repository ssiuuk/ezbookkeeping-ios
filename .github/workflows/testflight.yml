name: Release to TestFlight

# Builds a signed app and uploads it to TestFlight whenever a version tag (vX.Y.Z) is pushed or
# created on the GitHub releases page. The README's "TestFlight releases" section lists the secrets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 1.2.0 (default: 1.0 plus the run number)'
        required: false

permissions:
  contents: read

# one upload at a time, so build numbers reach App Store Connect in order
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    # the repository variable IOS_RELEASE_RUNNER picks the Mac, as JSON: for example
    # ["self-hosted", "macOS"] for your own Mac; GitHub's macos-latest when it isn't set
    runs-on: ${{ fromJSON(vars.IOS_RELEASE_RUNNER || '"macos-latest"') }}
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Choose the version and build number
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-1.0}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::'$version' is not a version App Store Connect accepts (use a tag like v1.2.0)"
            exit 1
          fi
          # TestFlight needs a new, higher build number for every upload
          build="${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Building version $version ($build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the signing secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_CERT_P12_BASE64 PROVISIONING_PROFILE_BASE64 WIDGET_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the README's TestFlight section)"
            exit 1
          fi

      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          if ! command -v xcodegen > /dev/null; then brew install xcodegen; fi
          xcodegen generate

      - name: Install the certificate, profiles and API key
        id: signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # a keychain of its own, so a self-hosted Mac's login keychain is left alone
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          keychain_password="$(uuidgen)"
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains-before"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains-before")
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Apple Distribution[^"]*"' | head -n 1 | tr -d '"')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::DIST_CERT_P12_BASE64 has no Apple Distribution certificate"
            exit 1
          fi

          # one App Store profile for the app and one for its widget; prints the profile's UUID and name
          install_profile() {
            profile="$RUNNER_TEMP/$1.mobileprovision"
            printf '%s' "$2" | base64 --decode > "$profile"
            security cms -D -i "$profile" > "$RUNNER_TEMP/$1.plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$1.plist")"
            # Xcode 16 and later read the first folder, older versions the second
            for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$profile" "$dir/$uuid.mobileprovision"
            done
            rm -f "$profile"
            echo "${1}_uuid=$uuid" >> "$GITHUB_OUTPUT"
            echo "${1}_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$1.plist")" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/$1.plist"
          }
          install_profile app "$PROVISIONING_PROFILE_BASE64"
          install_profile widget "$WIDGET_PROVISIONING_PROFILE_BASE64"

          # altool reads the key from here
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"

          {
            echo "keychain=$keychain"
            echo "identity=$identity"
            echo "key_path=$key_path"
          } >> "$GITHUB_OUTPUT"
          echo "Signing with $identity"

      - name: Archive
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_PROFILE: ${{ steps.signing.outputs.app_name }}
          WIDGET_PROFILE: ${{ steps.signing.outputs.widget_name }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          if ! xcodebuild archive \
            -project EzBookkeeping.xcodeproj -scheme EzBookkeeping -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EzBookkeeping.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            APP_PROFILE_SPECIFIER="$APP_PROFILE" \
            WIDGET_PROFILE_SPECIFIER="$WIDGET_PROFILE" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" > "$RUNNER_TEMP/archive.log" 2>&1; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u || true
            tail -n 100 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/archive.log"

      - name: Export the .ipa
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_UUID: ${{ steps.signing.outputs.app_uuid }}
          WIDGET_UUID: ${{ steps.signing.outputs.widget_uuid }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store-connect" \
            -c "Add :destination string export" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string $IDENTITY" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.ssiuuk.ezbookkeeping string $APP_UUID" \
            -c "Add :provisioningProfiles:com.ssiuuk.ezbookkeeping.widget string $WIDGET_UUID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EzBookkeeping.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded to App Store Connect; TestFlight shows it once Apple has processed it (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing material
        # matters on a self-hosted Mac, which keeps its files between runs
        if: always()
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          APP_UUID: ${{ steps.signing.outputs.app_uuid }}
          WIDGET_UUID: ${{ steps.signing.outputs.widget_uuid }}
          KEY_PATH: ${{ steps.signing.outputs.key_path }}
        run: |
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before")
          fi
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          for uuid in "$APP_UUID" "$WIDGET_UUID"; do
            if [ -n "$uuid" ]; then
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision" \
                "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            fi
          done
          if [ -n "$KEY_PATH" ]; then rm -f "$KEY_PATH"; fi
          rm -rf "$RUNNER_TEMP/export" "$RUNNER_TEMP/EzBookkeeping.xcarchive" "$RUNNER_TEMP/DerivedData" \
            "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/widget.mobileprovision"
